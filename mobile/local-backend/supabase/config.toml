# Local development stack for Floura (Supabase CLI).
# This is NOT the hosted project: that project (ref gghesvpmskjlrlpoosgf) no longer exists.
# Ports are shifted by +2000 from the CLI defaults (54xxx = old local "floura" stack, 55xxx = AuraMind) so this stack can run next to other local stacks.
project_id = "floura-local"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"

[inbucket]
# catches the auth emails locally (http://127.0.0.1:56324), e.g. the password reset code
enabled = true
port = 56324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off here so local sign-ups are instant. Bloom has confirmations on; the app then asks for the code from the
# email (src/screens/ConfirmEmailScreen.js). Set to true (and restart the stack) to try that flow with Mailpit.
enable_confirmations = false

# The reset email carries a code, not a link (src/screens/ForgotPasswordScreen.js). Paste the same template on
# Bloom: dashboard > Authentication > Emails > Reset password (docs/LAUNCH.md item 9).
[auth.email.template.recovery]
subject = "Your code to set a new password"
content_path = "./supabase/templates/recovery.html"

# Sign-up confirmation by code as well (src/screens/ConfirmEmailScreen.js); used whenever confirmations are on.
# Paste into Bloom: dashboard > Authentication > Emails > Confirm signup.
[auth.email.template.confirmation]
subject = "Your Luna code"
content_path = "./supabase/templates/confirmation.html"

[edge_runtime]
# pet-stylize / pet-chat need provider keys (Gemini, OpenRouter, Groq) that do not exist locally.
enabled = false

# Edge Functions that `npm run functions:deploy -- <name>` may deploy. The code lives in mobile/supabase/functions;
# entrypoint paths are relative to this file. Only pet-talk and pet-stylize are declared on purpose: pet-chat and
# weekly-summary are retired and must not be deployed.
[functions.pet-talk]
enabled = true
# the function checks the user's session itself as well
verify_jwt = true
entrypoint = "../../supabase/functions/pet-talk/index.ts"

# The painted portrait (docs/pet-portrait-v3.md). Needs GEMINI_API_KEY in the function secrets.
[functions.pet-stylize]
enabled = true
verify_jwt = true
entrypoint = "../../supabase/functions/pet-stylize/index.ts"

[analytics]
enabled = false
