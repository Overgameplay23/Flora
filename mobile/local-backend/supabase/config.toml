# Local development stack for Floura (Supabase CLI).
# This is NOT the hosted project: that project (ref gghesvpmskjlrlpoosgf) no longer exists.
# Ports are shifted by +2000 from the CLI defaults (54xxx = old local "floura" stack, 55xxx = AuraMind) so this stack can run next to other local stacks.
project_id = "floura-local"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
# Sign-up returns a session immediately. The app's Signup screen has no "check your email" state yet.
enable_confirmations = false

[edge_runtime]
# pet-stylize / pet-chat need provider keys (Gemini, OpenRouter, Groq) that do not exist locally.
enabled = false

# Edge Functions that `npm run functions:deploy -- <name>` may deploy. The code lives in mobile/supabase/functions;
# entrypoint paths are relative to this file. Only pet-talk is declared on purpose: pet-chat and weekly-summary
# are retired and must not be deployed, and pet-stylize waits on the owner's decision about the painted portrait.
[functions.pet-talk]
enabled = true
# the function checks the user's session itself as well
verify_jwt = true
entrypoint = "../../supabase/functions/pet-talk/index.ts"

[analytics]
enabled = false
